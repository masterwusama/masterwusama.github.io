<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>在线游戏 · 恐怖生存 RPG</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0b14; overflow: hidden; touch-action: none; overscroll-behavior: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { background: #000; box-shadow: 0 0 60px rgba(0, 0, 0, 0.85); image-rendering: pixelated; touch-action: none; -webkit-user-select: none; user-select: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="800" height="608"></canvas></div>

<!-- 引擎层（ES5 IIFE，挂载到 window.Game） -->
<script src="src/data.js"></script>
<script src="src/input.js"></script>
<script src="src/camera.js"></script>
<script src="src/map.js"></script>
<script src="src/player.js"></script>
<script src="src/renderer.js"></script>
<script src="src/core.js"></script>

<!-- 数据层（地图数据注册，须在引擎之后加载） -->
<script src="data/maps/prologue.js"></script>
<script src="data/maps/test.js"></script>

<script>
  Game.boot(document.getElementById('game'));
</script>
</body>
</html>
