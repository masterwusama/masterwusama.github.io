          <button type="button" class="dnd-btn dnd-btn-sm" id="dice-crit">暴击 · 双骰</button>
        </div>
        <div id="expr-result"></div>
      </div>

      <div class="dnd-card">
        <h2 class="dnd-card-title">历史记录</h2>
        <ul class="dice-history" id="dice-history"></ul>
        <button type="button" class="dnd-btn dnd-btn-sm" id="dice-clear-history">清空记录</button>
