name: update-stock-data

# 定时更新 A 股财务数据（stock-data/ 子文件夹）
# 说明：GitHub Actions 的 workflow 文件必须放在仓库根目录 .github/workflows/ 下
#      才会被执行，因此本文件无法放进 stock-data/ 子文件夹中隔离。
#      它只提交 stock-data/data 下的数据文件，不会触碰博客的其他内容。

on:
  # 双时段定时（周一至周六，周日无交易跳过）：
  #   主时段 UTC 8:00  = 北京 16:00（A 股 15:00 收盘后，收盘价/市值已稳定）
  #   兜底时段 UTC 14:00 = 北京 22:00（防主时段 cron 因 GitHub 调度延迟/漏触发导致当日无更新）
  #   两时段独立触发；引擎按交易日幂等跳重，同日重复跑不产生重复调仓/重复数据提交
  schedule:
    - cron: "0 8 * * 1-6"
    - cron: "0 14 * * 1-6"
  # 支持在 GitHub 网页上手动触发
  workflow_dispatch:

# 只授予读取仓库 + 写回数据文件的最小权限
permissions:
  contents: write

concurrency:
  group: stock-data-update
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 名单增长后全量抓取（含定期报告 PDF 审计解析）本地实测约 40~50 分钟，
    # 原 30 分钟上限会导致抓取步骤被掐死、后续调仓与提交整步跳过（连续多日空更新的根因）。提到 60 分钟。
    timeout-minutes: 60
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        working-directory: stock-data/scripts
        run: pip install -r requirements.txt

      - name: 抓取数据
        working-directory: stock-data/scripts
        # 单步封顶 50 分钟，给后面的提交步骤留出缓冲；即便偶尔挂死也不会吃掉整个 job 预算
        timeout-minutes: 50
        run: python fetch_data.py

      - name: 提交数据变更
        if: always()
        run: |
          git config user.name stock-data-bot
          git config user.email stock-data-bot@users.noreply.github.com
          git add -A stock-data/data
          if git diff --cached --quiet; then echo "本次无数据变更"; exit 0; fi
          git commit -m "chore(stock-data): 更新 A 股财务数据"
          # 容忍与 agro-price / market-price 等并行 workflow 抢先推进 master 的推送竞争：
          # 提交后工作树已干净，rebase 到最新 origin/master 再推，冲突则退避重试。
          n=0
          until git push origin "HEAD:${GITHUB_REF_NAME}"; do
            n=$((n+1)); [ "$n" -ge 6 ] && { echo "推送多次失败，放弃"; exit 1; }
            echo "推送失败，第 $n 次重试（rebase 最新远端）"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; break; }
            sleep 3
          done
          echo "已提交并推送"
