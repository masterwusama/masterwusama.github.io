---
layout: page
title: 冰箱做菜
---

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="./assets/app.css">

<div id="fc-app">
  <div class="fc-header">
    <h1 class="fc-title">🍳 冰箱做菜</h1>
    <p class="fc-sub">报出冰箱里有什么，告诉你今天能做啥</p>
  </div>

  <!-- 视图切换 -->
  <div class="fc-tabs" role="tablist">
    <button class="fc-tab is-active" data-view="cook" role="tab">做菜推荐</button>
    <button class="fc-tab" data-view="library" role="tab">菜谱库</button>
  </div>

  <!-- ============ 做菜推荐视图 ============ -->
  <div id="fc-view-cook" class="fc-view">
    <!-- 食材输入 -->
    <section class="fc-card">
      <div class="fc-input-row">
        <input id="fc-input" type="text" class="fc-input" placeholder="输入食材，如：土豆" autocomplete="off">
        <button id="fc-input-add" class="fc-btn fc-btn-primary">添加</button>
      </div>
      <div id="fc-suggest" class="fc-suggest" hidden></div>
      <div id="fc-fridge" class="fc-chips"></div>
      <div class="fc-chips-label">常用食材（点击添加）</div>
      <div id="fc-common" class="fc-chips"></div>
      <div class="fc-chips-label">快过期？（长按已添加食材可标记 ⭐，优先推荐用掉）</div>
    </section>

    <!-- 筛选与排序 -->
    <section class="fc-card">
      <div class="fc-filter-row">
        <label class="fc-filter-label">工具：</label>
        <span id="fc-tools" class="fc-filter-opts"></span>
      </div>
      <div class="fc-filter-row">
        <label class="fc-filter-label">难度：</label>
        <span id="fc-difficulty" class="fc-filter-opts"></span>
      </div>
      <div class="fc-filter-row">
        <label class="fc-filter-label">排序：</label>
        <span id="fc-sort" class="fc-filter-opts"></span>
      </div>
    </section>

    <!-- 推荐结果 -->
    <div id="fc-result-head" class="fc-result-head" hidden>
      <span id="fc-result-count"></span>
      <button id="fc-clear-fridge" class="fc-link-btn">清空冰箱</button>
    </div>
    <div id="fc-result" class="fc-result"></div>

    <!-- 购物清单 -->
    <section id="fc-shopping" class="fc-card" hidden>
      <div class="fc-card-title">🛒 购物清单 <span class="fc-card-sub">（所有推荐菜缺失食材汇总）</span></div>
      <div id="fc-shopping-list" class="fc-shopping-list"></div>
      <button id="fc-copy-list" class="fc-btn fc-btn-ghost">复制清单</button>
    </section>
  </div>

  <!-- ============ 菜谱库视图 ============ -->
  <div id="fc-view-library" class="fc-view" hidden>
    <section class="fc-card">
      <input id="fc-search" type="text" class="fc-input" placeholder="搜索菜名 / 食材，如：土豆" autocomplete="off">
      <div class="fc-lib-bar">
        <div id="fc-cat-filter" class="fc-cats"></div>
        <button id="fc-fav-only" class="fc-cat" type="button">☆ 只看收藏</button>
      </div>
    </section>
    <div id="fc-library" class="fc-library"></div>
  </div>

  <!-- 菜谱详情弹层 -->
  <div id="fc-detail-mask" class="fc-mask" hidden>
    <div id="fc-detail" class="fc-detail"></div>
  </div>

  <!-- 设置 -->
  <section class="fc-card fc-settings">
    <div class="fc-card-title">数据管理</div>
    <p class="fc-settings-tip">冰箱清单等数据保存在本浏览器。换设备可用备份迁移。</p>
    <div class="fc-settings-row">
      <button id="fc-export" class="fc-btn fc-btn-ghost">导出备份</button>
      <button id="fc-import" class="fc-btn fc-btn-ghost">导入备份</button>
      <button id="fc-reset" class="fc-btn fc-btn-ghost fc-btn-danger">清空本机数据</button>
      <input id="fc-import-file" type="file" accept=".json" hidden>
    </div>
  </section>

  <p class="fc-footer">数据仅存于本浏览器 · 菜谱库随仓库更新</p>
</div>

<script src="./assets/store.js"></script>
<script src="./assets/app.js"></script>
