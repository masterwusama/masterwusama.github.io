<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · 掷骰决定</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% -10%, #241b36 0%, #171222 55%, #100c1a 100%);
      font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
      color: #e8e2d4;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 15% 30%, rgba(255, 235, 180, .6), transparent 60%),
        radial-gradient(1px 1px at 45% 70%, rgba(255, 235, 180, .45), transparent 60%),
        radial-gradient(1.5px 1.5px at 75% 25%, rgba(255, 235, 180, .55), transparent 60%),
        radial-gradient(1px 1px at 88% 68%, rgba(255, 235, 180, .4), transparent 60%);
      pointer-events: none;
    }
    .wrap { text-align: center; }
    .die {
      width: 84px;
      height: 84px;
      margin: 0 auto;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      border: 2.5px solid #d4af37;
      background: radial-gradient(circle at 50% 32%, #2a2038 0%, #1d1529 70%);
      box-shadow: 0 0 26px rgba(212, 175, 55, .35), inset 0 0 14px rgba(0, 0, 0, .55);
      animation: spin 1.2s ease-in-out infinite;
      user-select: none;
    }
    @keyframes spin {
      0%, 100% { transform: rotate(-14deg) scale(1); }
      50% { transform: rotate(14deg) scale(1.06); }
    }
    .txt {
      margin-top: 22px;
      font-size: 14px;
      letter-spacing: 2px;
      color: #8a8299;
    }
    .txt b { color: #d4af37; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="die">🎲</div>
    <p class="txt">页面不存在……<b>正在掷骰决定 404 的风格</b></p>
  </div>
  <script>
    /* 随机入口：一半概率进 K 线版，一半概率进 D&D 版 */
    var from = encodeURIComponent(location.pathname + location.search);
    var target = Math.random() < 0.5 ? '/404-kline.html' : '/404-dnd.html';
    setTimeout(function () {
      location.replace(target + '?from=' + from);
    }, 900);
  </script>
</body>
</html>
